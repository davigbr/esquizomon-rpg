# Netlify config — Esquizomon RPG
# Build: SPA estática + 1 serverless function (ia).

[build]
  command = "npm run build"
  publish = "dist"

# A chave pública VAPID é PÚBLICA por design (vai no bundle do cliente, push.ts)
# — o scanner do Netlify a acusa porque VAPID_PUBLIC_KEY está marcada como
# secret no env do site. Isenta só ELA: a privada (VAPID_PRIVATE_KEY) segue
# protegida e continua bloqueando o build se vazar pro repo.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "VAPID_PUBLIC_KEY"

[functions]
  # Funções em netlify/functions, runtime default (Node 20).
  directory = "netlify/functions"

# A function /api/ia gera respostas longas (invocação, /analisar) e o timeout
# default de 10s estourava em 504 no chat. 26s é o teto do Netlify.
[functions."ia"]
  timeout = 26

# Redireciona /api/ia → function /.netlify/functions/ia
# (mesma URL em dev e prod — Vite middleware serve /api/ia em dev)
[[redirects]]
  from = "/api/ia"
  to = "/.netlify/functions/ia"
  status = 200

# Push: cadastro/cancelamento de assinaturas de notificação.
[[redirects]]
  from = "/api/push"
  to = "/.netlify/functions/push"
  status = 200

# Lembretes diários (push): roda a cada minuto e dispara quem tiver o horário
# batendo. Em UTC (fuso do servidor); o offset do device está em cada assinatura.
[functions."reminders"]
  schedule = "* * * * *"

# SPA: rotas do hash-router não precisam de fallback (são client-side),
# mas qualquer URL desconhecida volta pro index.html pro PWA/sw.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
